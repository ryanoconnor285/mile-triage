<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <style>
      /* Light theme defaults */
      .bg { fill: #0f172a; }                  /* Slate Dark Background */
      .grid { stroke: #1e293b; stroke-width: 1; opacity: 0.5; }
      .path-glow { stroke: #06b6d4; stroke-width: 6; opacity: 0.25; stroke-linecap: round; stroke-linejoin: round; }
      .path-line { stroke: #06b6d4; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .pin-start { fill: #94a3b8; }          /* Neutral Start Pin */
      .pin-end { fill: #10b981; }            /* IRS Green Business End Pin */

      /* Dark theme browser tab optimization */
      @media (prefers-color-scheme: dark) {
        .bg { fill: #020617; }                /* Deeper Black/Navy Background */
        .path-glow { opacity: 0.4; }
      }
    </style>
  </defs>

  <!-- Rounded Squircle Background Canvas -->
  <rect class="bg" x="0" y="0" width="64" height="64" rx="14" />

  <!-- Subtle Tech Grid Lines -->
  <line class="grid" x1="16" y1="0" x2="16" y2="64" />
  <line class="grid" x1="32" y1="0" x2="32" y2="64" />
  <line class="grid" x1="48" y1="0" x2="48" y2="64" />
  <line class="grid" x1="0" y1="32" x2="64" y2="32" />

  <!-- Route Glow (Underlay) -->
  <polyline class="path-glow" points="14,46 23,18 32,34 41,18 50,46" />

  <!-- Stylized 'M' Drive Route Line -->
  <polyline class="path-line" points="14,46 23,18 32,34 41,18 50,46" />

  <!-- Start Pin (Trip Origin) -->
  <circle class="pin-start" cx="14" cy="46" r="4.5" />
  <circle fill="#0f172a" cx="14" cy="46" r="1.5" />

  <!-- End Pin (Business / Destination Triage) -->
  <circle class="pin-end" cx="50" cy="46" r="5.5" />
  <circle fill="#ffffff" cx="50" cy="46" r="2" />
</svg>
